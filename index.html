<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="mue" />
  <meta name="description" content="Turn a picture into sound. The image is painted into the audio's spectrogram." />
  <title>mue · image → sound</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/icon-180.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>mue</h1>
      <p class="tagline">image → sound. Every row of pixels is a sine wave; brightness is loudness.</p>
    </header>

    <section id="dropzone" class="dropzone" aria-label="Image input">
      <input id="file" type="file" accept="image/*" hidden />
      <div id="preview-wrap" class="preview-wrap">
        <canvas id="preview" class="pixel" aria-label="Encoded image preview"></canvas>
        <div id="playhead" class="playhead"></div>
      </div>
      <button id="pick" class="btn btn-secondary" type="button">Choose or take a photo</button>
    </section>

    <section class="transport" aria-label="Playback">
      <button id="play" class="btn btn-primary" type="button" disabled>Render &amp; play</button>
      <button id="stop" class="btn btn-secondary" type="button" disabled>Stop</button>
      <button id="save" class="btn btn-secondary" type="button" disabled>Save WAV</button>
    </section>
    <p id="status" class="status" role="status" aria-live="polite"></p>

    <section class="output" aria-label="Live spectrogram">
      <h2>What comes back out <span class="muted">(live spectrogram of playback)</span></h2>
      <canvas id="spectrogram" class="pixel spectrogram"></canvas>
    </section>

    <details class="settings">
      <summary>Settings</summary>
      <div class="grid">
        <label>Duration (s)
          <input id="duration" type="number" inputmode="decimal" min="0.5" max="60" step="0.5" value="6" />
        </label>
        <label>Bands (rows)
          <input id="bands" type="number" inputmode="numeric" min="8" max="1024" step="8" value="128" />
        </label>
        <label>Low freq (Hz)
          <input id="fmin" type="number" inputmode="numeric" min="20" max="20000" step="10" value="400" />
        </label>
        <label>High freq (Hz)
          <input id="fmax" type="number" inputmode="numeric" min="20" max="20000" step="10" value="8000" />
        </label>
        <label>Frequency scale
          <select id="scale">
            <option value="linear" selected>Linear (matches most spectrogram apps)</option>
            <option value="log">Logarithmic (more musical)</option>
          </select>
        </label>
        <label>Columns per second
          <input id="cps" type="number" inputmode="decimal" min="4" max="200" step="1" value="40" />
        </label>
        <label>Gamma (contrast)
          <input id="gamma" type="number" inputmode="decimal" min="0.1" max="8" step="0.1" value="1.6" />
        </label>
        <label>Silence floor (0–1)
          <input id="floor" type="number" inputmode="decimal" min="0" max="1" step="0.05" value="0.05" />
        </label>
        <label class="check">
          <input id="invert" type="checkbox" /> Invert (dark pixels are loud)
        </label>
      </div>
    </details>

    <footer class="foot">
      <p>Inspired by Benn Jordan's <em>“I Saved a PNG Image To A Bird”</em>. Open source, MIT.</p>
      <p class="muted">Tip: hold another phone running a spectrogram app up to the speaker.</p>
    </footer>
  </main>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
